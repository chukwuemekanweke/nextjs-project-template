packages:
  - "apps/*"
  - "packages/*"
  # Private, non-deployed developer tooling (UI workbench).
  - "tooling/*"

allowBuilds:
  # Native dependencies required by Next.js image processing and ESLint resolution.
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

